name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Restaurar corpus
        uses: actions/cache@v4
        with:
          path: data/corpora
          key: corpora-${{ hashFiles('data/metadata/corpora.json') }}

      - name: Descargar corpus
        run: pnpm data:sync

      - name: Restaurar páginas exportadas
        uses: actions/cache@v4
        with:
          path: dist-static
          key: pages-${{ github.event.repository.name }}-${{ hashFiles('apps/web/src/**', '!apps/web/src/styles/**', 'packages/**', 'data/metadata/**', 'apps/web/astro.config.mjs', 'scripts/export-static.mjs', 'package.json', 'apps/web/package.json') }}

      - name: Compilar la aplicación
        run: pnpm build

      - name: Exportar el sitio estático
        run: >-
          node scripts/export-static.mjs
          --start-server
          --resume
          --base "/${{ github.event.repository.name }}"
          --out dist-static
          --servers 2
          --concurrency 6

      - name: Publicar el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
